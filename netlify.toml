[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/poster/*"
  to = "/.netlify/functions/poster/:splat"
  status = 200

[[redirects]]
  from = "/api/poster"
  to = "/.netlify/functions/poster"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
